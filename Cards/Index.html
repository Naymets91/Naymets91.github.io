<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Word Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Тренажер слів</h1>

    <!-- Вибір словника -->
    <label for="wordSet">Набір слів:</label>
    <select id="wordSet">
      <option value="words.json">Основні слова</option>
      <option value="istqb.json">ISTQB терміни</option>
    </select>

    <!-- Прогрес -->
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>

    <!-- Лічильник слів + таймер в одному рядку -->
    <div class="top-info">
      <span id="progress-text">0/0</span>
      <span id="timer">⏳ 25 сек</span>
    </div>

    <!-- Слово -->
    <h2 id="word">...</h2>

    <!-- Варіанти -->
    <div id="options"></div>

    <!-- Кнопки -->
    <div class="buttons-row">
      <button id="skipBtn">⏭ Пропустити</button>
      <button id="resetBtn">🔄 Скинути</button>
      <button id="modeBtn">🧪 Тест</button>
    </div>

    <!-- Статистика -->
    <div class="stats">
      <p>✔ Вірних: <span id="score">0</span></p>
      <p>❌ Спроб: <span id="attempts">0</span></p>
      <p>⏭ Пропущено: <span id="skipped">0</span></p>
      <p>🎯 Точність: <span id="accuracy">0%</span></p>
