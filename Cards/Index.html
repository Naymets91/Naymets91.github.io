<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Word Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Тренажер слів</h1>

  <div class="top-controls">
    <label>Набір слів:
      <select id="wordSet">
        <option value="words.json">Основні слова</option>
        <option value="istqb.json">ISTQB</option>
        <option value="time.json">Час</option>
        <option value="basic300.json">A0–A1 (300 слів)</option>
      </select>
    </label>

    <label class="invert-label">
      <input type="checkbox" id="invertMode">
      Інверсія (укр → англ)
    </label>
  </div>

  <div id="word" class="word">...</div>

  <div id="options" class="options"></div>

  <div class="bottom-controls">
    <button id="skipBtn">Пропустити</button>
    <button id="resetBtn">Скинути</button>
    <button id="modeBtn">Тест</button>
  </div>

  <div class="progress-container">
    <div id="progress-bar"></div>
  </div>
  <div id="progress-text">0/0</div>

  <div id="timer">⏳ 25 сек</div>

  <div id="stats">
    Правильно: <span id="score">0</span> |
    Спроб: <span id="attempts">0</span> |
    Пропущено: <span id="skipped">0</span> |
    Точність: <span id="accuracy">0%</span>
  </div>

  <div id="summary" class="summary" style="display:none;">
    <h2>Результати тесту</h2>
    Правильно: <span id="sumCorrect"></span><br>
    Неправильно: <span id="sumWrong"></span><br>
    Пропущено: <span id="sumSkipped"></span><br>
    Точність: <span id="sumAccuracy"></span><br>
    Бал: <span id="sumScore"></span>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
